<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA AI Engine - Аналитика 2026</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #050505; color: #00ff41; margin: 0; padding: 20px; }
        header { border-bottom: 1px solid #00ff41; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { margin: 0; font-size: 1.5em; letter-spacing: 3px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 15px; }
        .card { background: #000; border: 1px solid #00ff41; padding: 15px; position: relative; }
        .teams { font-size: 1.1em; color: #fff; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.85em; }
        .label { color: #888; }
        .val { color: #00ff41; text-align: right; }
        .prediction-box { margin-top: 15px; padding: 10px; border-top: 1px dashed #00ff41; }
        .bar-container { background: #222; height: 4px; margin-top: 5px; }
        .bar-fill { background: #00ff41; height: 100%; }
        footer { margin-top: 50px; opacity: 0.5; font-size: 0.7em; }
    </style>
</head>
<body>
    <header>
        <h1>NBA_AI_CORE v.2026_PRO</h1>
        <p>[STATUS: ACTIVE] [DATA_FEED: NBA_OFFICIAL_API] [MODEL: NBABrain_100px]</p>
    </header>

    <div class="grid" id="prediction-grid">
</div>

    <footer>
        <p>> system_log: parsing PTS, AST, REB, BLK, B2B, Fatigue, Coaching_Impact...</p>
    </footer>
</body>
</html>
