name: Daily NBA Prediction

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Загружаем всю историю, чтобы pull работал корректно

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install torch pandas nba_api beautifulsoup4 numpy

      - name: Train and Predict
        run: |
          # Сначала тренируем и предсказываем
          python train.py
          python predict_today.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "NBA-AI-Bot"
          git config --global user.email "bot@github.com"
          
          # 1. Прячем результаты работы нейронки
          git add .
          git stash
          
          # 2. Обновляемся из облака
          git pull origin main --rebase
          
          # 3. Достаем результаты нейронки обратно
          git stash pop || echo "No changes to pop"
          
          # 4. Финальный аккорд: добавляем всё заново и пушим
          git add index.html nba_model_2026.pth
          
          # Делаем коммит только если файлы реально изменились
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "AI Prediction Update: $(date)"
            git push origin main
          else
            echo "No changes to commit"
          fi

