name: Daily NBA Prediction

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Загружаем всю историю, чтобы pull работал корректно

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install torch pandas nba_api beautifulsoup4 numpy

      - name: Train and Predict
        run: |
          # Сначала тренируем и предсказываем
          python train.py
          python predict_today.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "NBA-AI-Bot"
          git config --global user.email "bot@github.com"
          
          # Вместо сложного pull, просто забираем актуальное состояние
          git add index.html nba_model_2026.pth
          
          # Если есть изменения в облаке, этот шаг их подтянет БЕЗ конфликта с индексом
          git stash # Временно прячем наши новые файлы
          git pull origin main --rebase
          git stash pop # Возвращаем их обратно
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "AI Update: $(date)" && git push origin main)
